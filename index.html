<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuelSnap — Developer Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #161e2e; border: 1px solid #1e293b; border-radius: 16px; padding: 36px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { margin: 0 0 10px; font-size: 26px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; background: #0284c7; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; margin: 6px; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .links { margin-top: 20px; font-size: 13px; color: #64748b; }
        .links a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>FuelSnap</h1>
        <p>Smart, offline-first fuel expense tracker and mileage analytics for modern drivers.</p>
        <div>
            <a href="https://niravbhavsar66.github.io/fuelsnap-privacy-policy/" class="btn">Privacy Policy</a>
            <a href="app-ads.txt" class="btn" style="background: #334155;">app-ads.txt</a>
        </div>
        <div class="links">
            <p>Developer Contact & Compliance Portal</p>
        </div>
    </div>
</body>
